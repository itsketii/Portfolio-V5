name: Build & deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/10 * * * *"     # toutes les 10 minutes (GitHub peut retarder un peu)
  workflow_dispatch:           # lancement manuel

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Vérifier la présence des secrets Spotify
        run: |
          if ([string]::IsNullOrEmpty("${{ secrets.SPOTIFY_CLIENT_ID }}")) { throw "SPOTIFY_CLIENT_ID est absent" }
          if ([string]::IsNullOrEmpty("${{ secrets.SPOTIFY_CLIENT_SECRET }}")) { throw "SPOTIFY_CLIENT_SECRET est absent" }
          if ([string]::IsNullOrEmpty("${{ secrets.SPOTIFY_REFRESH_TOKEN }}")) { throw "SPOTIFY_REFRESH_TOKEN est absent" }
        shell: pwsh

      - name: Générer les données (Spotify + GitHub)
        run: node scripts/update-data.mjs
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GH_USER: ${{ github.repository_owner }}

      - name: Assembler le site
        run: cp -r index.html assets _site/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
